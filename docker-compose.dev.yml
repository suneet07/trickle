# Just the backing services, for running the app itself with pnpm:
#
#   docker compose -f docker-compose.dev.yml up -d
#   pnpm dev:api & pnpm dev:worker & pnpm dev:web

name: trickle-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trickle
      POSTGRES_PASSWORD: trickle
      POSTGRES_DB: trickle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devpgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  devpgdata:
